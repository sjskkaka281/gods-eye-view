# Deploy God's Eye View to GitHub Pages.
# After a successful run, the site is:
#   https://sjskkaka281.github.io/gods-eye-view/
#
# One-time setup in the repo:
#   Settings → Pages → Source: GitHub Actions
#
# NOTE ON --base: this builds with a RELATIVE base ('./') rather than
# '/gods-eye-view/'. vite-plugin-cesium joins the Vite base onto its own
# 'cesium/' prefix, so an absolute base emitted dist/gods-eye-view/cesium/**
# while index.html asked for /gods-eye-view/cesium/** — every Cesium file 404'd
# and the app hung on the loading screen. A relative base keeps the engine at
# dist/cesium/** and makes the bundle work at the project-page subpath, at a
# custom domain, and from a local `npx serve dist` alike.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npx vite build --base ./

      - name: Verify the Cesium engine shipped with the bundle
        # Fail loudly here rather than deploying a page that boots to a
        # permanent "Initializing photorealistic world..." spinner. This is the
        # exact regression that broke the first deploy: index.html referenced
        # /gods-eye-view/cesium/Cesium.js while the file landed in
        # dist/gods-eye-view/cesium/, so the engine 404'd.
        run: |
          set -euo pipefail
          for f in dist/index.html dist/cesium/Cesium.js dist/cesium/Widgets/widgets.css; do
            test -s "$f" || { echo "::error::missing build output: $f"; exit 1; }
          done
          # Real src=/href= attributes must be base-relative. (data-* hooks are
          # excluded: those are resolved through assetUrl() at fetch time.)
          if grep -qE '[[:space:]](src|href)="/' dist/index.html; then
            echo "::error::index.html contains root-absolute asset URLs; they 404 on a project page"
            grep -oE '[[:space:]](src|href)="/[^"]*' dist/index.html || true
            exit 1
          fi
          test -d dist/models || { echo "::error::public/models did not ship"; exit 1; }
          echo "Build verified: Cesium engine present and asset paths are base-relative."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
