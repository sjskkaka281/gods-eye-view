# Deploy God's Eye View to GitHub Pages.
#
# Live site after a successful run:
#   https://sjskkaka281.github.io/gods-eye-view/
#
# One-time repo setting:  Settings -> Pages -> Source: GitHub Actions
#
# ---------------------------------------------------------------------------
# WHY THIS FILE LOOKS BUSY
#
# The first deploy went green but shipped a dead page: it hung forever on
# "Initializing photorealistic world..." with "Cesium is not defined".
#
# Cause: the build ran with --base /gods-eye-view/. vite-plugin-cesium joins the
# Vite base onto its own 'cesium/' prefix and uses that for BOTH the <script src>
# in index.html AND the folder it copies the engine into. So the engine landed in
#   dist/gods-eye-view/cesium/Cesium.js
# while index.html asked for
#   /gods-eye-view/cesium/Cesium.js   ->  dist/cesium/Cesium.js   (404)
#
# Fix 1: build with a relative base ('./') so the engine stays at dist/cesium/**.
#
# Fix 2: Vite rewrites asset URLs it can see statically, but NOT plain strings
# handed to Cesium/fetch at runtime ('/models/*.glb', '/logo.svg', '/mic.svg').
# Those still point at the domain root and 404 on a project page. The "Patch
# runtime asset paths" step below adds a tiny assetUrl() helper and applies it at
# the fetch sites only, so the '/...' literals stay valid as model lookup keys.
# It runs on a throwaway CI checkout - your repository files are never modified.
# ---------------------------------------------------------------------------

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Patch runtime asset paths for the project subpath
        run: |
          cat > /tmp/patch-asset-paths.mjs <<'PATCH_SCRIPT'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';

          // Create the helper that resolves a root-relative asset path against
          // the deploy base. Applied ONLY where a URL is fetched, so the
          // '/models/...' literals stay intact as geometry lookup-table keys.
          const HELPER = `/**
           * Resolve a root-relative public asset path against the app's deploy base.
           * Generated by the Pages workflow; see .github/workflows/pages.yml.
           */
          export function assetUrl(path) {
            if (typeof path !== 'string' || !path) return path;
            if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(path)) return path;
            let base = '/';
            try { base = import.meta.env?.BASE_URL || '/'; } catch { base = '/'; }
            if (base === '/' || base === '') return path;
            const relative = path.startsWith('/') ? path.slice(1) : path;
            if (base.startsWith('.')) {
              const docBase = globalThis.document?.baseURI;
              if (docBase) {
                try { return new URL(relative, docBase).href; } catch { /* fall through */ }
              }
            }
            return base.endsWith('/') ? \`\${base}\${relative}\` : \`\${base}/\${relative}\`;
          }

          export default assetUrl;
          `.replace(/^ {10}/gm, '');

          writeFileSync('src/assetUrl.js', HELPER);
          console.log('created src/assetUrl.js');

          let failures = 0;

          function edit(file, importLine, importAnchor, replacements) {
            if (!existsSync(file)) {
              console.error(`::error::missing source file: ${file}`);
              failures++;
              return;
            }
            let text = readFileSync(file, 'utf8');

            if (!text.includes(importLine)) {
              if (importAnchor === null) {
                text = `${importLine}\n\n${text}`;
              } else if (text.includes(importAnchor)) {
                text = text.replace(importAnchor, `${importAnchor}\n${importLine}`);
              } else {
                console.error(`::error::${file}: import anchor not found`);
                failures++;
                return;
              }
            }

            for (const [from, to] of replacements) {
              if (text.includes(to)) continue;        // already applied
              if (!text.includes(from)) {
                console.error(`::error::${file}: pattern not found -> ${from.slice(0, 60)}`);
                failures++;
                continue;
              }
              text = text.replace(from, to);
            }

            writeFileSync(file, text);
            console.log(`patched ${file}`);
          }

          edit(
            'src/data/flights.js',
            "import { assetUrl } from '../assetUrl.js';",
            "import { aircraftIcon, TRACKED_ICON_PX } from './aircraftIcons.js';",
            [
              ['url: spec.url,', 'url: assetUrl(spec.url),'],
              ['url: trackedSpec.url,', 'url: assetUrl(trackedSpec.url),'],
              ['{ url: PLANE_MODEL_URL, asynchronous: false }', '{ url: assetUrl(PLANE_MODEL_URL), asynchronous: false }'],
            ],
          );

          edit(
            'src/data/militaryFlights.js',
            "import { assetUrl } from '../assetUrl.js';",
            "import { holdContinuousRender, releaseContinuousRender } from '../renderGovernor.js';",
            [
              ['url: spec.url,', 'url: assetUrl(spec.url),'],
              ['url: trackedSpec.url,', 'url: assetUrl(trackedSpec.url),'],
              ['{ url: JET_MODEL_URL, asynchronous: false }', '{ url: assetUrl(JET_MODEL_URL), asynchronous: false }'],
            ],
          );

          edit(
            'src/logoGaze.js',
            "import { assetUrl } from './assetUrl.js';",
            null,
            [['await window.fetch(source)', 'await window.fetch(assetUrl(source))']],
          );

          edit(
            'src/voice/gevRealtime.js',
            "import { assetUrl } from '../assetUrl.js';",
            "import { createGevActionRunner, readLayerLifecycleSummary } from './gevActions.js';",
            [['<img src="/mic.svg" alt="" />', '<img src="${assetUrl(\'/mic.svg\')}" alt="" />']],
          );

          if (failures) {
            console.error(`::error::${failures} patch step(s) failed - refusing to build`);
            process.exit(1);
          }
          console.log('All runtime asset paths patched.');
          PATCH_SCRIPT
          node /tmp/patch-asset-paths.mjs

      - name: Build production bundle
        # Relative base: keeps the Cesium engine at dist/cesium/** and makes the
        # bundle work at the project subpath, a custom domain, or a local serve.
        run: npx vite build --base ./

      - name: Verify the bundle actually boots
        # Fail here rather than deploying another page that spins forever.
        run: |
          set -euo pipefail
          for f in dist/index.html dist/cesium/Cesium.js dist/cesium/Widgets/widgets.css; do
            test -s "$f" || { echo "::error::missing build output: $f"; exit 1; }
          done
          if grep -qE '[[:space:]](src|href)="/' dist/index.html; then
            echo "::error::root-absolute asset URLs in index.html would 404 on a project page"
            grep -oE '[[:space:]](src|href)="/[^"]*' dist/index.html || true
            exit 1
          fi
          test -d dist/models || { echo "::error::public/models did not ship"; exit 1; }
          if grep -qE '"/models/[a-z0-9]+\.glb"' dist/assets/*.js; then
            if ! grep -q 'BASE_URL\|baseURI' dist/assets/*.js; then
              echo "::error::model paths were not routed through assetUrl()"
              exit 1
            fi
          fi
          echo "Verified: Cesium engine present, asset paths base-relative."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
